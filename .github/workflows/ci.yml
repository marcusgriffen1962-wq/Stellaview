name: CI

on:
  push:
    branches: [main, master]
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    name: Verify on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Build static export
        run: npm run build

      - name: Smoke test telemetry collector
        run: |
          node -e "require('./electron/system.cjs').createSnapshot()"

      - name: Verify exported app
        run: |
          node -e "const fs=require('fs'); if(!fs.existsSync('out/index.html')||!fs.existsSync('out/logo.png')) process.exit(1)"
