name: Bug report
description: Report something that is broken or behaving unexpectedly
title: "[Bug]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: Thanks for helping improve Stellaview. Please fill in as much detail as you can.

  - type: input
    id: version
    attributes:
      label: Stellaview version
      description: Shown in the sidebar footer.
      placeholder: "1.0.0"
    validations:
      required: true

  - type: input
    id: distro
    attributes:
      label: Linux distribution and version
      placeholder: "Ubuntu 24.04"
    validations:
      required: true

  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: Describe the problem and what you expected instead.
    validations:
      required: true

  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Launch Stellaview
        2. Open ...
        3. See ...
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: Relevant logs or screenshots
      description: If you launched from a terminal, paste any error output here.
      render: shell
